spring.application.name=Subsidy-platform-test
server.port=8081

# Local MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/government-subsidy-db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root

# Dynamic Password fallback: Uses your password, falls back to 'admin123' if not set
spring.datasource.password=${DB_PASSWORD:root@123}

# Hibernate properties to auto-generate tables matching your Java entity
#Temporarily set your DDL strategy to create to wipe old table configurations
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
