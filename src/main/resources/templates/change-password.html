<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>SAGAR - Change Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
        }
        .panel {
            max-width: 450px;
            margin: 65px auto;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 22px #0001;
        }
        h2 {
            color: #121b55;
        }
        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccd;
            border-radius: 6px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #151a65;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .error {
            color: #a22;
        }
        .message {
            color: #176d38;
        }
        a {
            color: #151a65;
        }
    </style>
</head>
<body>
<main class="panel">
    <h2>Change password</h2>
    <p th:if="${error}" th:text="${error}" class="error"></p>
    <p th:if="${message}" th:text="${message}" class="message"></p>
    <form th:action="@{/change-password}" method="post">
        <label>Current password</label
        ><input type="password" name="currentPassword" required /><label
    >New password</label
    ><input type="password" name="password" minlength="8" required /><label
    >Confirm new password</label
    ><input
            type="password"
            name="confirmPassword"
            minlength="8"
            required
    /><button>Change password</button>
    </form>
    <p><a th:href="@{/dashboard}">Back to dashboard</a></p>
</main>
</body>
</html>
