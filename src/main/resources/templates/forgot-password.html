<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SAGAR | Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
        }
        .panel {
            max-width: 450px;
            margin: 65px auto;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 22px #0001;
        }
        h2 {
            color: #121b55;
        }
        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccd;
            border-radius: 6px;
        }
        button {
            margin-top: 18px;
            width: 100%;
            padding: 12px;
            background: #151a65;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error {
            color: #a22;
        }
        .message {
            color: #176d38;
        }
        a {
            color: #151a65;
        }
        .small {
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
<main class="panel">
    <h2>Reset your password</h2>
    <p th:if="${error}" th:text="${error}" class="error"></p>
    <p th:if="${message}" th:text="${message}" class="message"></p>
    <form
            th:if="${stage == 'email'}"
            th:action="@{/forgot-password/request}"
            method="post"
    >
        <label>Registered email</label
        ><input
            type="email"
            name="email"
            required
            autocomplete="email"
    /><button type="submit">Send reset code</button>
    </form>
    <div th:if="${stage == 'otp'}">
        <p class="small">
            Code sent to <strong th:text="${resetEmail}"></strong>
        </p>
        <p class="small">OTP expires in <b id="expiryTimer">05:00</b></p>
        <form th:action="@{/forgot-password/verify}" method="post">
            <label>6-digit reset code</label
            ><input
                name="otp"
                pattern="[0-9]{6}"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
        /><button type="submit">Verify OTP</button>
        </form>
        <form th:action="@{/forgot-password/request}" method="post">
            <input type="hidden" name="email" th:value="${resetEmail}" /><button
                type="submit"
                id="resendBtn"
                disabled
        >
            Resend OTP
        </button>
        </form>
    </div>
    <form
            th:if="${stage == 'password'}"
            th:action="@{/forgot-password/reset}"
            method="post"
    >
        <p class="small">OTP verified. Set a new password.</p>
        <label>New password</label
        ><input type="password" name="password" minlength="8" required /><label
    >Confirm new password</label
    ><input type="password" name="confirmPassword" minlength="8" required />
        <p class="small">
            Use uppercase, lowercase, number and special character (8+
            characters).
        </p>
        <button type="submit">Update password</button>
    </form>
    <div th:if="${stage == 'success'}">
        <p>Your new password is ready. You can now sign in.</p>
        <a th:href="@{/login}">Go to login</a>
    </div>
    <p th:unless="${stage == 'success'}">
        <a th:href="@{/login}">Back to login</a>
    </p>
</main>
<script th:if="${stage == 'otp'}" th:inline="javascript">
    const expiry = /*[[${expiryEpoch}]]*/ null;
    const resend = /*[[${resendEpoch}]]*/ null;
    function update() {
        const now = Math.floor(Date.now() / 1000);
        const left = Math.max(0, (expiry || 0) - now);
        document.getElementById("expiryTimer").textContent =
            String(Math.floor(left / 60)).padStart(2, "0") +
            ":" +
            String(left % 60).padStart(2, "0");
        const r = Math.max(0, (resend || 0) - now);
        const btn = document.getElementById("resendBtn");
        btn.disabled = r > 0;
        btn.textContent = r > 0 ? "Resend OTP (" + r + "s)" : "Resend OTP";
    }
    update();
    setInterval(update, 1000);
</script>
</body>
</html>
